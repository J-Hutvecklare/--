<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#e85d75">
<title>奶娃</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./feeding-bottle.png">
<link rel="apple-touch-icon" href="./feeding-bottle.png">
<!-- 单文件，可离线打开。数据键：baby_tracker_v1 -->
<style>
  :root {
    --paper: #fdf6ee;
    --card: #ffffff;
    --ink: #2d2d2d;
    --muted: #666666;
    --rose: #e85d75;
    --green: #5cb8a5;
    --gold: #f5c040;
    --blue: #6b7fb5;
    --line: #e0d8cc;
    --radius: 12px;
    --danger: #8c1d36;
    --ok: #135c48;
    --tabbar: calc(8px + 44px + 12px + 2px + env(safe-area-inset-bottom, 0px));
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    max-width: 100%;
    min-height: 100%;
    color: var(--ink);
    background-color: var(--paper);
    overflow-x: hidden;
  }

  html {
    font-size: 16px;
    scroll-padding-bottom: calc(var(--tabbar) + 16px);
  }

  body {
    font-family: Nunito, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color-scheme: light;
    background-color: var(--paper);
    background-image: none;
  }

  ::selection { background: #f8d6a8; color: var(--ink); }

  ::placeholder { color: var(--muted); opacity: 1; }

  :focus:not(:focus-visible) { outline: none; }

  :focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }

  button, input, select, textarea {
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    touch-action: manipulation;
  }

  .page {
    width: 100%;
    max-width: 720px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 16px 16px calc(var(--tabbar) + 16px);
    position: relative;
    background: var(--paper);
    overflow-x: clip;
  }

  .sheet {
    position: relative;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    margin: 16px 0;
    padding: 20px 14px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  .cover { margin-top: 4px; }

  .profile-row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .profile-text { min-width: 0; flex: 1 1 auto; }

  .profile-name,
  .profile-age {
    margin: 0;
    font-size: 16px;
    line-height: 1.35;
  }

  .profile-name {
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .profile-age { color: var(--muted); }

  .profile-card.is-link { cursor: pointer; }

  button.profile-age {
    display: block;
    width: 100%;
    min-height: 0;
    margin: 0;
    padding: 0;
    background: transparent;
    color: var(--ink);
    border: 0;
    border-radius: 0;
    box-shadow: none;
    font-weight: 400;
    text-align: left;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  button.profile-age:hover,
  button.profile-age:active {
    transform: none;
    background: transparent;
    box-shadow: none;
  }

  .avatar,
  .avatar-preview {
    position: relative;
    flex: 0 0 auto;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: #fdecef;
    overflow: hidden;
  }

  .avatar {
    width: calc(16px * 1.35 * 2);
    height: calc(16px * 1.35 * 2);
  }

  .avatar-preview { width: 72px; height: 72px; }

  .avatar img,
  .avatar-preview img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .avatar:empty::before,
  .avatar-preview:empty::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 36%;
    height: 36%;
    border-radius: 50%;
    background: rgba(232, 93, 117, 0.45);
    transform: translate(-50%, -50%);
  }

  .avatar-row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .file-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    min-width: 44px;
    padding: 8px 14px;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    box-shadow: none;
    cursor: pointer;
  }

  .avatar-preview { margin: 0 auto 12px; }

  .avatar-upload { margin: 0 0 12px; }

  .avatar-upload:focus-within .file-btn {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }

  .saved-note { margin: 4px 0 0; min-height: 0; font-size: 16px; }
  .saved-note:empty { display: none; }
  .saved-note.is-ok { color: var(--ok); }
  .saved-note.is-bad { color: var(--danger); }

  .setting-list { margin: 4px 0 0; }

  .setting-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 44px;
    margin: 0;
    padding: 12px 2px;
    background: transparent;
    color: var(--ink);
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    box-shadow: none;
    text-align: left;
    font-weight: 400;
  }

  .setting-list .setting-row:first-child { border-top: 1px solid var(--line); }

  .setting-row:hover,
  .setting-row:active {
    transform: none;
    background: transparent;
    box-shadow: none;
  }

  .setting-label { flex: 0 0 auto; font-weight: 700; }

  .setting-value {
    flex: 1 1 auto;
    min-width: 0;
    margin-left: auto;
    overflow: hidden;
    color: var(--ink);
    font-weight: 400;
    text-align: right;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .setting-chevron {
    flex: 0 0 auto;
    width: 8px;
    height: 8px;
    border-right: 2px solid var(--ink);
    border-bottom: 2px solid var(--ink);
    transform: rotate(-45deg);
  }

  .record-block { margin: 12px 0 8px; }

  input.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    min-height: 0;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
    white-space: nowrap;
  }

  .date-sheet .time-cols { grid-template-columns: repeat(3, minmax(0, 1fr)); }

  h1 {
    margin: 0;
    min-width: 0;
    font-size: clamp(1.45rem, 6vw, 1.9rem);
    font-weight: 700;
    line-height: 1.2;
  }

  h2, h3 {
    margin: 0 0 10px;
    font-weight: 700;
    line-height: 1.25;
  }

  h2 { font-size: 1.25rem; }
  h3 { font-size: 1rem; margin-bottom: 6px; }

  .lede, .hint, .empty, .foot p, .detail, .note, .when, .err, .status {
    margin: 0;
  }

  .lede, .hint, .note, .status, .foot p, .empty { color: var(--muted); }

  .lede, .hint, .note, .status, .foot p, .empty, .stat span {
    font-size: 15px;
  }

  .detail, .note, .lede, .hint, .status, .empty, .when, h1 {
    overflow-wrap: anywhere;
  }

  .tools {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-width: 0;
    max-width: 100%;
  }

  .tools button { flex: 1 1 140px; min-height: 44px; }

  .status {
    min-height: 0;
    margin: 0 0 8px;
  }

  .status:empty { display: none; }

  .tabs {
    position: fixed;
    z-index: 30;
    left: 0;
    right: 0;
    bottom: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 8px max(16px, calc((100% - 720px) / 2 + 16px)) calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--paper);
    border: 0;
    border-top: 2px solid var(--line);
    border-radius: 0;
    box-shadow: 0 -3px 0 rgba(0, 0, 0, 0.06);
  }

  button {
    min-height: 44px;
    padding: 8px 10px;
    background: var(--card);
    color: var(--ink);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    box-shadow: none;
    cursor: pointer;
  }

  .tabs button {
    min-height: 44px;
    padding: 8px 8px;
    background: var(--paper);
  }

  .mark-red { background: #fdecef; }
  .mark-yellow { background: #fff6dc; }
  .mark-teal { background: #e8f7f3; }
  .mark-blue { background: #eef1f8; }

  button:hover:not(:disabled) { background: #fff; }

  button.setting-row:hover,
  button.setting-row:active,
  button.profile-age:hover,
  button.profile-age:active {
    background: transparent;
  }

  .tabs button[aria-selected="true"] {
    background: #fdecef;
    color: var(--ink);
    border-color: var(--rose);
    font-weight: 700;
  }

  .tabs button[aria-selected="false"] {
    background: var(--paper);
    color: var(--muted);
    border-color: transparent;
    box-shadow: none;
  }

  button.is-saved {
    background: #e8f7f3;
    border-color: var(--green);
  }

  button:disabled,
  button:disabled:hover,
  button:disabled:active {
    opacity: 0.45;
    cursor: default;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    max-width: 100%;
    margin: 0 0 8px;
  }

  .pair {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 8px;
    min-width: 0;
  }

  .choice {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    min-width: 0;
    margin: 0 0 8px;
  }

  .choice-item {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 44px;
    padding: 8px 4px;
    background: rgba(255, 255, 255, 0.8);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color 200ms ease-out, background-color 200ms ease-out;
  }

  .choice-item:has(input:checked) {
    border-color: var(--rose);
    background: #fdecef;
  }

  .choice-item input {
    width: 1.1rem;
    min-height: 0;
    margin: 0;
    padding: 0;
    accent-color: var(--rose);
    background: transparent;
    border-color: transparent;
  }

  input, select, textarea {
    display: block;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 8px 10px;
    background: rgba(255, 255, 255, 0.8);
    border: 2px solid rgba(232, 93, 117, 0.3);
    border-radius: var(--radius);
    transition: border-color 200ms ease-out;
  }

  input[type="date"],
  input[type="number"] {
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }

  input[type="hidden"] {
    display: none !important;
    min-height: 0;
    padding: 0;
    border: 0;
  }

  .time-field {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 44px;
    padding: 8px 10px;
    text-align: left;
    font-weight: 400;
    background: rgba(255, 255, 255, 0.8);
    border: 2px solid rgba(232, 93, 117, 0.3);
    box-shadow: none;
  }

  .time-field:hover,
  .time-field:active {
    transform: none;
    box-shadow: none;
  }

  .time-field .is-empty { color: var(--muted); }

  textarea { min-height: 56px; resize: vertical; }

  form button { width: 100%; }

  .err { color: var(--danger); min-height: 0; }
  .err:not(:empty) { margin-bottom: 8px; }
  .err.ok { color: var(--ok); }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    width: 100%;
    min-width: 0;
    margin: 8px 0;
  }

  .stat {
    min-width: 0;
    padding: 10px 10px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  .stat.tone-rose { border-top: 4px solid var(--rose); }
  .stat.tone-green { border-top: 4px solid var(--green); }
  .stat.tone-gold { border-top: 4px solid var(--gold); }
  .stat.tone-blue { border-top: 4px solid var(--blue); }

  .stat .extra {
    display: block;
    margin-top: 4px;
    color: var(--ink);
    font-size: 16px;
    overflow-wrap: anywhere;
  }

  .stat span { color: var(--muted); }
  .stat b {
    display: block;
    margin-top: 2px;
    font-size: 1.7rem;
    font-weight: 700;
    line-height: 1.1;
    overflow-wrap: anywhere;
  }

  .hint { margin: 2px 0 8px; }

  .day-nav {
    display: flex;
    flex-wrap: nowrap;
    align-items: stretch;
    gap: 8px;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    margin: 4px 0 8px;
  }

  .day-nav button {
    flex: 0 0 auto;
    min-height: 44px;
    padding: 8px 10px;
    white-space: nowrap;
  }

  .day-pick {
    position: relative;
    flex: 1 1 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 44px;
    background: rgba(255, 255, 255, 0.8);
    border: 2px solid rgba(232, 93, 117, 0.3);
    border-radius: var(--radius);
    cursor: pointer;
  }

  .day-pick:focus-within {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }

  .day-pick span {
    font-size: 16px;
    font-weight: 700;
    pointer-events: none;
  }

  #history-date {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    min-height: 44px;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }

  .today-title { margin: 18px 0 8px; font-size: 1.15rem; }

  .today-log { margin-top: 8px; }
  .today-log .empty { font-size: 16px; }

  .log-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .log-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    padding: 4px 0;
    border-bottom: 2px solid var(--line);
    transform: none;
  }

  .log-row:last-child { border-bottom: 0; padding-bottom: 0; }

  .log-text {
    flex: 1 1 auto;
    min-width: 0;
    margin: 0;
    font-size: 16px;
    overflow-wrap: anywhere;
  }

  .log-row .del { min-width: 44px; min-height: 44px; }

  .subtabs {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    min-width: 0;
    margin: 0 0 8px;
    padding: 8px;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: var(--radius);
  }

  .subtabs button {
    min-height: 44px;
    padding: 8px 4px;
    background: transparent;
    color: var(--muted);
    border-color: transparent;
    box-shadow: none;
  }

  .subtabs button[aria-selected="true"] {
    color: var(--ink);
    font-weight: 700;
    box-shadow: none;
  }

  .subtabs button[data-kind="feed"][aria-selected="true"] {
    background: #fdecef;
    border-color: var(--rose);
  }

  .subtabs button[data-kind="diaper"][aria-selected="true"] {
    background: #fff6dc;
    border-color: var(--gold);
  }

  .subtabs button[data-kind="sleep"][aria-selected="true"] {
    background: #eef1f8;
    border-color: var(--blue);
  }

  .record-card form { margin: 0; min-width: 0; max-width: 100%; }

  .history-tools { margin-top: 18px; margin-bottom: 4px; }

  .item-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-width: 0;
    margin-bottom: 4px;
  }

  .when { font-size: 1.45rem; font-weight: 700; }

  .del { flex: 0 0 auto; min-height: 44px; background: var(--card); }

  .mark {
    display: inline-block;
    width: 12px;
    height: 12px;
    margin-right: 4px;
    vertical-align: -1px;
    background: var(--rose);
    border-radius: 4px;
  }

  .mark-poop { background: var(--gold); }
  .mark-pee { background: var(--green); }
  .mark-both { background: var(--blue); }
  .mark-sleep { background: var(--blue); }

  .note {
    margin-top: 4px;
    overflow-wrap: anywhere;
  }

  .empty { margin: 12px 4px; color: var(--muted); }

  .foot {
    margin-top: 22px;
    padding-top: 8px;
    background: var(--paper);
    color: var(--muted);
  }

  html.time-open,
  html.time-open body {
    overflow: hidden;
    overscroll-behavior: none;
  }

  .time-sheet {
    position: fixed;
    z-index: 80;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .time-sheet-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(45, 45, 45, 0.35);
    animation: time-fade 240ms ease-out;
  }

  .time-sheet-panel {
    position: relative;
    width: min(100%, 720px);
    margin: 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    background: var(--card);
    border: 2px solid var(--line);
    border-bottom: 0;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -4px 0 rgba(0, 0, 0, 0.06);
    animation: time-rise 260ms ease-out;
  }

  .time-preview {
    margin: 0 0 8px;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
  }

  .time-cols {
    position: relative;
    display: grid;
    grid-template-columns: 1.5fr 0.8fr 0.8fr;
    gap: 6px;
  }

  .time-highlight {
    position: absolute;
    z-index: 0;
    left: 0;
    right: 0;
    top: 88px;
    height: 44px;
    background: #fdecef;
    border: 2px solid rgba(232, 93, 117, 0.35);
    border-radius: 12px;
    pointer-events: none;
  }

  .time-col {
    position: relative;
    z-index: 1;
    height: 220px;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    overscroll-behavior: contain;
    background: transparent;
  }

  .time-pad { height: 88px; }

  .time-opt {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-align: center;
    color: var(--muted);
    font-size: 16px;
  }

  .time-opt.is-on {
    color: var(--ink);
    font-weight: 700;
  }

  .time-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .time-actions button { flex: 1; min-height: 44px; }

  @keyframes time-rise {
    from { transform: translateY(110%); }
    to { transform: translateY(0); }
  }

  @keyframes time-fade {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (min-width: 800px) {
    .stat-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }

    .time-sheet-panel,
    .time-sheet-backdrop { animation: none; }
  }
</style>
</head>
<body>
<main class="page" id="app">
  <p id="status" class="status" role="status"></p>
  <nav class="tabs" id="tabs" role="tablist" aria-label="分页">
    <button type="button" role="tab" data-tab="home" aria-selected="true" aria-controls="panel-home">首页</button>
    <button type="button" role="tab" data-tab="history" aria-selected="false" aria-controls="panel-history">历史</button>
    <button type="button" role="tab" data-tab="settings" aria-selected="false" aria-controls="panel-settings">设置</button>
  </nav>

  <section id="panel-home" data-panel="home" role="tabpanel">
  <header class="sheet cover profile-card" id="profile-card">
    <div class="profile-row">
      <div class="avatar" id="home-avatar"></div>
      <div class="profile-text">
        <p class="profile-name" id="home-name">宝宝</p>
        <p class="profile-age" id="home-age" hidden></p>
        <button type="button" class="profile-age" id="home-age-go">去设置里填出生日期</button>
      </div>
    </div>
  </header>

    <div class="record-block">
      <div class="subtabs" role="tablist" aria-label="记录类型">
        <button type="button" role="tab" data-kind="feed" aria-selected="true">喂奶</button>
        <button type="button" role="tab" data-kind="diaper" aria-selected="false">换尿布</button>
        <button type="button" role="tab" data-kind="sleep" aria-selected="false">睡眠</button>
      </div>
    <form id="form-feed" data-kind-panel="feed" autocomplete="off" novalidate>
      <div class="field">
        <label id="label-feed-start" for="feed-start-btn">开始时间</label>
        <button type="button" id="feed-start-btn" class="time-field" aria-labelledby="label-feed-start feed-start-text"><span class="time-field-text is-empty" id="feed-start-text">选择时间</span></button>
        <input type="hidden" name="time" data-time="now">
      </div>
      <div class="field">

<script>
(function () {
  'use strict';

  /* PURE_START */
  // 固定键名。records 是记录，profile 是小名、生日和头像。旧数据没有 profile 时当作还没设置。
  var STORAGE_KEY = 'baby_tracker_v1';

  function pad(num) {
    return String(num).padStart(2, '0');
  }

  function dayKeyFromDate(date) {
    return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
  }

  function toLocalInputValue(date) {
    return dayKeyFromDate(date) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
  }

  function todayKey() {
    return dayKeyFromDate(new Date());
  }

  // 无时区的时间当成用户本地时间；带 Z 或数字偏移的先按绝对时间，再归到本地日历日。
  function parseTime(str) {
    if (typeof str !== 'string') return null;
    var text = str.trim();
    if (!text) return null;
    if (/(?:z|[+-]\d{2}:?\d{2})$/i.test(text)) {
      var zoned = new Date(text);
      return Number.isNaN(zoned.getTime()) ? null : zoned;
    }
    var match = /^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2})(?::(\d{2}))?)?$/.exec(text);
    if (!match) {
      var fallback = new Date(text);
      return Number.isNaN(fallback.getTime()) ? null : fallback;
    }
    var year = Number(match[1]);
    var month = Number(match[2]);
    var day = Number(match[3]);
    var hour = Number(match[4] || '0');
    var minute = Number(match[5] || '0');
    var second = Number(match[6] || '0');
    if (month < 1 || month > 12 || day < 1 || day > 31) return null;
    if (hour > 23 || minute > 59 || second > 59) return null;
    var date = new Date(year, month - 1, day, hour, minute, second);
    if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null;
    return date;
  }

  function localDayOf(str) {
    var date = parseTime(str);
    if (!date) return '';
    return dayKeyFromDate(date);
  }

  function timeValue(str) {
    var date = parseTime(str);
    return date ? date.getTime() : 0;
  }

  function addDays(dateKey, delta) {
    var match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateKey);
    if (!match) return '';
    var date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
    date.setDate(date.getDate() + delta);
    return dayKeyFromDate(date);
  }

  // 历史日期不能走到今天之后。走不过去时停在原日。
  function shiftDate(current, delta, today) {
    var next = addDays(current, delta);
    if (!next || next > today) return current;
    return next;
  }

  function parseAmount(raw) {
    var text = String(raw == null ? '' : raw).trim();
    if (text === '') return { ok: false, empty: true, value: 0 };
    if (!/^(?:\d+\.?\d*|\.\d+)$/.test(text)) return { ok: false, empty: false, value: 0 };
    var value = Number(text);
    if (!Number.isFinite(value) || value < 0) return { ok: false, empty: false, value: 0 };
    return { ok: true, empty: false, value: value };
  }

  function validateFeedInput(input) {
    var time = String(input.time || '').trim();
    var end = String(input.end || '').trim();
    if (!parseTime(time)) return { ok: false, message: '开始时间没填好' };
    if (!parseTime(end)) return { ok: false, message: end ? '结束时间没填好' : '结束时间要填' };
    if (parseTime(end).getTime() <= parseTime(time).getTime()) {
      return { ok: false, message: '结束时间要晚于开始时间' };
    }
    var note = String(input.note || '').trim().slice(0, 200);
    if (input.feedType === 'breast') {
      var left = parseAmount(input.left);
      var right = parseAmount(input.right);
      if (!left.ok || !right.ok) {
        var invalid = (!left.ok && !left.empty) || (!right.ok && !right.empty);
        return { ok: false, message: invalid ? '分钟要填不小于 0 的数字' : '左右分钟都要填' };
      }
      if (left.value === 0 && right.value === 0) return { ok: false, message: '至少一侧要大于 0' };
      return {
        ok: true,
        message: '',
        record: { type: 'feed', time: time, end: end, feedType: 'breast', leftMin: left.value, rightMin: right.value, note: note }
      };
    }
    if (input.feedType !== 'breast_bottle' && input.feedType !== 'formula') {
      return { ok: false, message: '类型没选好' };
    }
    var ml = parseAmount(input.amount);
    if (!ml.ok || ml.value <= 0) {
      return { ok: false, message: ml.empty ? '奶量要填' : '奶量要填大于 0 的数字' };
    }
    return {
      ok: true,
      message: '',
      record: { type: 'feed', time: time, end: end, feedType: input.feedType, amountMl: ml.value, note: note }
    };
  }

  function validateDiaperInput(input) {
    var time = String(input.time || '').trim();
    if (!parseTime(time)) return { ok: false, message: '时间没填好' };
    if (input.kind !== 'poop' && input.kind !== 'pee' && input.kind !== 'both') {
      return { ok: false, message: '要选大便、小便或都有' };
    }
    var note = String(input.note || '').trim().slice(0, 200);
    return { ok: true, message: '', record: { type: input.kind, time: time, note: note } };
  }

  function validateSleepInput(input) {
    var start = String(input.start || '').trim();
    if (!parseTime(start)) return { ok: false, message: '开始时间没填好' };
    var note = String(input.note || '').trim().slice(0, 200);
    var end = String(input.end || '').trim();
    var record = { type: 'sleep', time: start, note: note };
    if (!end) return { ok: true, message: '', record: record };
    if (!parseTime(end)) return { ok: false, message: '结束时间没填好' };
    if (parseTime(end).getTime() <= parseTime(start).getTime()) {
      return { ok: false, message: '结束时间要晚于开始时间' };
    }
    record.end = end;
    return { ok: true, message: '', record: record };
  }

  function prettyNumber(value) {
    var num = Number(value);
    if (!Number.isFinite(num)) return '0';
    return String(Math.round(num * 10) / 10);
  }

  function clockText(timeStr) {
    var date = parseTime(timeStr);
    if (!date) return String(timeStr || '');
    return pad(date.getHours()) + ':' + pad(date.getMinutes());
  }

  // 结束空着、或结束不晚于开始时，不编造时长。
  function sleepSpanMs(rec) {
    if (!rec || typeof rec.end !== 'string' || !rec.end.trim()) return null;
    var start = parseTime(rec.time);
    var end = parseTime(rec.end);
    if (!start || !end) return null;
    var diff = end.getTime() - start.getTime();
    return diff > 0 ? diff : null;
  }

  function formatDuration(ms) {
    if (!(ms > 0)) return '';
    var totalMin = Math.floor(ms / 60000);
    if (totalMin < 1) return '不足 1 分';
    var hours = Math.floor(totalMin / 60);
    var mins = totalMin % 60;
    if (hours && mins) return hours + ' 小时 ' + mins + ' 分';
    if (hours) return hours + ' 小时';
    return mins + ' 分';
  }

  function describe(rec) {
    if (rec.type === 'poop') return '大便';
    if (rec.type === 'pee') return '小便';
    if (rec.type === 'both') return '都有';
    if (rec.type === 'sleep') {
      var span = sleepSpanMs(rec);
      if (span != null) return formatDuration(span);
      if (typeof rec.end === 'string' && rec.end.trim()) return '';
      return '还在睡';
    }
    if (rec.feedType === 'breast') {
      return '亲喂 · 左 ' + prettyNumber(rec.leftMin) + ' 分 · 右 ' + prettyNumber(rec.rightMin) + ' 分';
    }
    var name = rec.feedType === 'formula' ? '配方奶' : '母乳瓶喂';
    return name + ' · ' + prettyNumber(rec.amountMl) + ' ml';
  }

  function nonNegative(value) {
    var num = Number(value);
    if (!Number.isFinite(num) || num < 0) return 0;
    return num;
  }

  // 母乳瓶喂和配方奶分开计毫升。亲喂只计入喂奶次数。睡眠按开始时间归到当天。
  function summarize(records, dateKey) {
    var rows = [];
    for (var i = 0; i < records.length; i += 1) {
      if (localDayOf(records[i].time) === dateKey) rows.push({ rec: records[i], index: i });
    }
    rows.sort(function (a, b) {
      var delta = timeValue(b.rec.time) - timeValue(a.rec.time);
      if (delta !== 0) return delta;
      return b.index - a.index;
    });
    var feedCount = 0;
    var breastBottleMl = 0;
    var formulaMl = 0;
    var poopCount = 0;
    var peeCount = 0;
    var sleepCount = 0;
    var sleepMs = 0;
    var list = [];
    for (var n = 0; n < rows.length; n += 1) {
      var rec = rows[n].rec;
      list.push(rec);
      if (rec.type === 'feed') {
        feedCount += 1;
        if (rec.feedType === 'breast_bottle') breastBottleMl += nonNegative(rec.amountMl);
        else if (rec.feedType === 'formula') formulaMl += nonNegative(rec.amountMl);
      } else if (rec.type === 'poop') {
        poopCount += 1;
      } else if (rec.type === 'pee') {
        peeCount += 1;
      } else if (rec.type === 'both') {
        // 都有：大便和小便各计 1 次。旧的分开记录仍按各自类型计数。
        poopCount += 1;
        peeCount += 1;
      } else if (rec.type === 'sleep') {
        sleepCount += 1;
        var span = sleepSpanMs(rec);
        if (span != null) sleepMs += span;
      }
    }
    return {
      list: list,
      feedCount: feedCount,
      breastBottleMl: Math.round(breastBottleMl * 10) / 10,
      formulaMl: Math.round(formulaMl * 10) / 10,
      poopCount: poopCount,
      peeCount: peeCount,
      sleepCount: sleepCount,
      sleepMs: sleepMs
    };
  }

  // 只按 id 删除一条。
  function removeRecord(records, id) {
    return records.filter(function (rec) { return rec.id !== id; });
  }

  function safeUuid() {
    try {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    } catch (err) { return ''; }
    return '';
  }

  function fallbackId() {
    return 'r-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function createId(seen) {
    for (var i = 0; i < 6; i += 1) {
      var id = safeUuid() || fallbackId();
      if (!seen || !seen.has(id)) return id;
    }
    return fallbackId() + fallbackId();
  }

  function normalizeRecord(raw, seen) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
    var type = raw.type;
    if (type !== 'feed' && type !== 'poop' && type !== 'pee' && type !== 'both' && type !== 'sleep') return null;
    if (typeof raw.time !== 'string' || !parseTime(raw.time)) return null;
    var note = typeof raw.note === 'string' ? raw.note.trim().slice(0, 200) : '';
    var feedType = '';
    var leftMin = 0;
    var rightMin = 0;
    var amountMl = 0;
    var end = '';
    if ((type === 'sleep' || type === 'feed') && typeof raw.end === 'string' && raw.end.trim() && parseTime(raw.end)) {
      end = raw.end.trim();
    }
    if (type === 'feed') {
      if (raw.feedType === 'breast') {
        feedType = 'breast';
        leftMin = nonNegative(raw.leftMin);
        rightMin = nonNegative(raw.rightMin);
      } else if (raw.feedType === 'breast_bottle' || raw.feedType === 'formula') {
        feedType = raw.feedType;
        amountMl = nonNegative(raw.amountMl);
      } else {
        return null;
      }
    }
    var id = typeof raw.id === 'string' ? raw.id.trim() : '';
    if (!id || seen.has(id)) id = createId(seen);
    seen.add(id);
    var rec = { id: id, type: type, time: raw.time.trim(), note: note };
    if (feedType) rec.feedType = feedType;
    if (feedType === 'breast') {
      rec.leftMin = leftMin;
      rec.rightMin = rightMin;
    } else if (feedType) {
      rec.amountMl = amountMl;
    }
    if ((type === 'sleep' || type === 'feed') && end) rec.end = end;
    return rec;
  }

  function blankProfile() {
    return { name: '', birthday: '', avatar: '' };
  }

  function lastDayOfMonth(year, monthIndex) {
    return new Date(year, monthIndex + 1, 0).getDate();
  }

  function addCalendarMonths(year, monthIndex, day, count) {
    var index = monthIndex + count;
    var nextYear = year + Math.floor(index / 12);
    var nextMonth = index % 12;
    if (nextMonth < 0) {
      nextMonth += 12;
      nextYear -= 1;
    }
    return { y: nextYear, m: nextMonth, d: Math.min(day, lastDayOfMonth(nextYear, nextMonth)) };
  }

  function compareYmd(a, b) {
    if (a.y !== b.y) return a.y - b.y;
    if (a.m !== b.m) return a.m - b.m;
    return a.d - b.d;
  }

  // 按本地日历从生日数到今天。未满 1 个月只留天数，出生当天是 0 天。满月、满岁后省略为 0 的部分。
  function ageParts(birthdayKey, todayKeyStr) {
    var birth = parseTime(birthdayKey);
    var today = parseTime(todayKeyStr);
    if (!birth || !today) return null;
    var b = { y: birth.getFullYear(), m: birth.getMonth(), d: birth.getDate() };
    var t = { y: today.getFullYear(), m: today.getMonth(), d: today.getDate() };
    if (compareYmd(t, b) < 0) return null;
    var years = t.y - b.y;
    var cursor = addCalendarMonths(b.y, b.m, b.d, years * 12);
    if (compareYmd(cursor, t) > 0) {
      years -= 1;
      cursor = addCalendarMonths(b.y, b.m, b.d, years * 12);
    }
    var months = 0;
    while (months < 12) {
      var next = addCalendarMonths(b.y, b.m, b.d, years * 12 + months + 1);
      if (compareYmd(next, t) > 0) break;
      months += 1;
      cursor = next;
    }
    var days = Math.round((Date.UTC(t.y, t.m, t.d) - Date.UTC(cursor.y, cursor.m, cursor.d)) / 86400000);
    return { years: years, months: months, days: days };
  }

  function formatAge(birthdayKey, todayKeyStr) {
    var parts = ageParts(birthdayKey, todayKeyStr);
    if (!parts) return '';
    if (parts.years === 0 && parts.months === 0) return parts.days + ' 天';
    var bits = [];
    if (parts.years > 0) bits.push(parts.years + ' 岁');
    if (parts.months > 0) bits.push(parts.months + ' 个月');
    if (parts.days > 0) bits.push(parts.days + ' 天');
    return bits.join(' ');
  }

    var summary = summarize(data.records, todayKey());
    renderStatGrid(document.getElementById('today-stats'), summary);
    renderList(document.getElementById('today-list'), summary.list, '今天还安静着，记下一笔就好。');
  }

  function monthDayLabel(dateKey) {
    var parts = String(dateKey || '').split('-');
    if (parts.length !== 3) return '';
    return parts[1] + '-' + parts[2];
  }

  function renderHistory() {
    var today = todayKey();
    if (historyDate > today) historyDate = today;
    document.getElementById('next-day').disabled = historyDate >= today;
    var picker = document.getElementById('history-date');
    picker.max = today;
    picker.value = historyDate;
    document.getElementById('history-md').textContent = monthDayLabel(historyDate);
    var summary = summarize(data.records, historyDate);
    var quiet = summary.list.length === 0;
    document.getElementById('history-stats').hidden = quiet;
    document.getElementById('history-hint').hidden = quiet;
    document.getElementById('history-empty').hidden = !quiet;
    if (quiet) document.getElementById('history-stats').replaceChildren();
    else renderHistoryStats(document.getElementById('history-stats'), summary);
  }

  function showKind(kind) {
    document.querySelectorAll('[data-kind]').forEach(function (button) {
      button.setAttribute('aria-selected', button.dataset.kind === kind ? 'true' : 'false');
    });
    document.querySelectorAll('[data-kind-panel]').forEach(function (panel) {
      panel.hidden = panel.dataset.kindPanel !== kind;
    });
  }

  function showTab(name) {
    currentTab = name;
    document.querySelectorAll('[data-panel]').forEach(function (panel) {
      panel.hidden = panel.dataset.panel !== name;
    });
    document.querySelectorAll('[data-tab]').forEach(function (button) {
      var on = button.dataset.tab === name;
      button.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    if (name === 'home') {
      renderProfile();
      renderToday();
    }
    if (name === 'history') renderHistory();
  }

  function showSettingNote(el, text, ok) {
    el.textContent = text;
    el.classList.toggle('is-ok', !!ok);
    el.classList.toggle('is-bad', !ok);
    if (el._timer) clearTimeout(el._timer);
    el._timer = setTimeout(function () { el.textContent = ''; }, ok ? 1100 : 2200);
  }

  function avatarAlt() {
    return (data.profile && data.profile.name) || '宝宝头像';
  }

  function paintAvatar(box, src) {
    box.replaceChildren();
    if (!src) {
      box.setAttribute('role', 'img');
      box.setAttribute('aria-label', avatarAlt());
      return;
    }
    box.removeAttribute('role');
    box.removeAttribute('aria-label');
    var img = document.createElement('img');
    img.alt = avatarAlt();
    img.src = src;
    box.appendChild(img);
  }

  function renderProfile() {
    var profile = data.profile || blankProfile();
    document.getElementById('home-name').textContent = profile.name || '宝宝';
    var age = document.getElementById('home-age');
    var go = document.getElementById('home-age-go');
    if (!profile.birthday) {
      age.hidden = true;
      age.textContent = '';
      go.hidden = false;
    } else {
      age.hidden = false;
      age.textContent = formatAge(profile.birthday, todayKey());
      go.hidden = true;
    }
    paintAvatar(document.getElementById('home-avatar'), profile.avatar);
    var nameInput = document.getElementById('profile-name');
    if (document.activeElement !== nameInput) nameInput.value = profile.name;
    document.getElementById('setting-name-value').textContent = profile.name || '未设置';
    var birthday = parseTime(profile.birthday);
    document.getElementById('setting-birthday-value').textContent = birthday
      ? birthday.getFullYear() + '年' + (birthday.getMonth() + 1) + '月' + birthday.getDate() + '日'
      : '未设置';
    document.getElementById('setting-avatar-value').textContent = profile.avatar ? '已设置' : '未设置';
    paintAvatar(document.getElementById('avatar-preview'), profile.avatar);
    document.getElementById('avatar-label').textContent = profile.avatar ? '更换照片' : '上传照片';
    fitAvatar();
  }

  function fitAvatar() {
    var nameBox = document.getElementById('home-name').getBoundingClientRect();
    var ageEl = document.getElementById('home-age');
    var go = document.getElementById('home-age-go');
    var ageBox = (go && !go.hidden ? go : ageEl).getBoundingClientRect();
    var size = Math.round(nameBox.height + ageBox.height);
    if (size < 16) return;
    var avatar = document.getElementById('home-avatar');
    avatar.style.width = size + 'px';
    avatar.style.height = size + 'px';
  }

  function saveName() {
    var input = document.getElementById('profile-name');
    var next = input.value.trim().slice(0, 40);
    input.value = next;
    if (next !== data.profile.name) {
      data.profile.name = next;
      if (!persist()) return;
      renderProfile();
    }
    showSettingNote(document.getElementById('settings-saved'), '已保存', true);
  }

  function openNameSheet() {
    returnFocus = document.activeElement;
    var input = document.getElementById('profile-name');
    input.value = data.profile.name;
    nameSheet.hidden = false;
    document.documentElement.classList.add('time-open');
    requestAnimationFrame(function () {
      if (!nameSheet.hidden) input.focus();
    });
  }

  function closeNameSheet(commit) {
    if (commit) saveName();
    nameSheet.hidden = true;
    if (!dateSheet || dateSheet.hidden) document.documentElement.classList.remove('time-open');
    restoreFocus();
  }

  function openAvatarSheet() {
    returnFocus = document.activeElement;
    avatarSheet.hidden = false;
    document.documentElement.classList.add('time-open');
    focusSheetCancel(avatarSheet);
  }

  function closeAvatarSheet() {
    avatarSheet.hidden = true;
    if ((!dateSheet || dateSheet.hidden) && (!timeSheet || timeSheet.hidden) && (!nameSheet || nameSheet.hidden)) {
      document.documentElement.classList.remove('time-open');
    }
    restoreFocus();
  }

  function compressAvatar(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var edge = Math.max(img.naturalWidth, img.naturalHeight) || 1;
        var scale = Math.min(1, 256 / edge);
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        var quality = 0.82;
        var dataUrl = canvas.toDataURL('image/jpeg', quality);
        while (dataUrl.length > 120000 && quality > 0.5) {
          quality -= 0.08;
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        }
        URL.revokeObjectURL(url);
        if (!/^data:image\/jpeg;base64,/.test(dataUrl) || dataUrl.length > 150000) {
          reject(new Error('large'));
          return;
        }
        resolve(dataUrl);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('read'));
      };
      img.src = url;
    });
  }

  function bindSettings() {
    setupDateSheet();
    nameSheet = document.getElementById('name-sheet');
    avatarSheet = document.getElementById('avatar-sheet');
    document.getElementById('open-name').addEventListener('click', openNameSheet);
    document.getElementById('open-birthday').addEventListener('click', openDateSheet);
    document.getElementById('open-avatar').addEventListener('click', openAvatarSheet);
    document.getElementById('home-age-go').addEventListener('click', function () { showTab('settings'); });
    nameSheet.addEventListener('click', function (event) {
      if (event.target.closest('[data-cancel]')) closeNameSheet(false);
      else if (event.target.closest('[data-ok]')) closeNameSheet(true);
    });
    avatarSheet.addEventListener('click', function (event) {
      if (event.target.closest('[data-cancel]')) closeAvatarSheet();
    });
    document.getElementById('profile-name').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        closeNameSheet(true);
      }
    });
    document.addEventListener('keydown', function (event) {
      if (event.key !== 'Escape') return;
      if (nameSheet && !nameSheet.hidden) closeNameSheet(false);
      else if (avatarSheet && !avatarSheet.hidden) closeAvatarSheet();
    });
    document.addEventListener('keydown', trapSheetTab);
    document.getElementById('avatar-file').addEventListener('change', function (event) {
      var file = event.target.files && event.target.files[0];
      event.target.value = '';
      if (!file) return;
      if (!file.type || file.type.indexOf('image/') !== 0) {
        showSettingNote(document.getElementById('settings-saved'), '这张照片读不出来', false);
        return;
      }
      compressAvatar(file).then(function (url) {
        data.profile.avatar = url;
        if (!persist()) return;
        renderProfile();
        showSettingNote(document.getElementById('settings-saved'), '已保存', true);
      }).catch(function () {
        showSettingNote(document.getElementById('settings-saved'), '这张照片读不出来', false);
      });
    });
  }

  function restoreSave(button) {
    if (button._savedTimer) clearTimeout(button._savedTimer);
    button.textContent = '保存';
    button.classList.remove('is-saved');
  }

  function markSaved(button) {
    restoreSave(button);
    button.textContent = '已保存';
    button.classList.add('is-saved');
    button._savedTimer = setTimeout(function () {
      button.textContent = '保存';
      button.classList.remove('is-saved');
    }, 1100);
  }

  function syncFeedFields() {
    var breast = document.querySelector('#form-feed [name="feedType"]').value === 'breast';
    document.getElementById('breast-fields').hidden = !breast;
    document.getElementById('bottle-fields').hidden = breast;
  }

  function remember(record) {
    var rec = normalizeRecord(Object.assign({ id: createId(usedIds()) }, record), usedIds());
    if (!rec) return;
    data.records.push(rec);
    persist();
    refreshViews();
  }

  function bindFeedForm() {
    var form = document.getElementById('form-feed');
    form.addEventListener('input', function () { clearFormMessage(form); });
    form.querySelector('[name="feedType"]').addEventListener('change', function () {
      syncFeedFields();
      clearFormMessage(form);
    });
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      var save = form.querySelector('button[type="submit"]');
      var result = validateFeedInput({
        time: currentTimeValue(form.querySelector('[name="time"]')),
        end: form.elements.end.value,
        feedType: form.querySelector('[name="feedType"]').value,
        left: form.elements.leftMin.value,
        right: form.elements.rightMin.value,
        amount: form.elements.amountMl.value,
        note: form.elements.note.value
      });
      if (!result.ok) {
        restoreSave(save);
        showFormMessage(form, result.message, false);
        return;
      }
      remember(result.record);
      form.elements.leftMin.value = '';
      form.elements.rightMin.value = '';
      form.elements.amountMl.value = '';
      form.elements.note.value = '';
      clearTime(form.elements.end);
      stampNow(form.querySelector('[name="time"]'));
      clearFormMessage(form);
      markSaved(save);
    });
  }

  function bindDiaperForm() {
    var form = document.getElementById('form-diaper');
    form.addEventListener('input', function () { clearFormMessage(form); });
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      var save = form.querySelector('button[type="submit"]');
      var picked = form.querySelector('[name="diaperKind"]:checked');
      var result = validateDiaperInput({
        kind: picked ? picked.value : '',
        time: currentTimeValue(form.querySelector('[name="time"]')),
        note: form.elements.note.value
      });
      if (!result.ok) {
        restoreSave(save);
        showFormMessage(form, result.message, false);
        return;
      }
      remember(result.record);
      form.elements.note.value = '';
      form.querySelectorAll('[name="diaperKind"]').forEach(function (el) { el.checked = false; });
      stampNow(form.querySelector('[name="time"]'));
      clearFormMessage(form);
      markSaved(save);
    });
  }

  function bindSleepForm() {
    var form = document.getElementById('form-sleep');
    form.addEventListener('input', function () { clearFormMessage(form); });
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      var save = form.querySelector('button[type="submit"]');
      var result = validateSleepInput({
        start: currentTimeValue(form.querySelector('[name="time"]')),
        end: form.elements.end.value,
        note: form.elements.note.value
      });
      if (!result.ok) {
        restoreSave(save);
        showFormMessage(form, result.message, false);
        return;
      }
      remember(result.record);
      clearTime(form.elements.end);
      form.elements.note.value = '';
      stampNow(form.querySelector('[name="time"]'));
      clearFormMessage(form);
      markSaved(save);
    });
  }

  // 日期选择器只能落到今天或更早，选中后直接打开那一天。
  function jumpHistory(value) {
    var today = todayKey();
    var next = addDays(value, 0);
    if (!next || next !== value || next > today) {
      document.getElementById('history-date').value = historyDate;
      return;
    }
    historyDate = next;
    renderHistory();
  }

  function exportJson() {
    var payload = sanitize(data);
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = 'baby-tracker-' + todayKey() + '.json';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    setStatus('导出好了');
  }

  // 先读文件，格式不对就不覆盖。格式对了，确认后才整份换掉。
  function importJson(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result).replace(/^\uFEFF/, ''));
      } catch (err) {
        alert('这份 JSON 认不出，没有导入。');
        return;
      }
      if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.records)) {
        alert('这份 JSON 认不出，没有导入。');
        return;
      }
      var keepProfile = !Object.prototype.hasOwnProperty.call(parsed, 'profile');
      var savedProfile = data.profile;
      var next = sanitize(parsed);
      if (keepProfile) next.profile = savedProfile;
      if (parsed.records.length > 0 && next.records.length === 0) {
        alert('里面没有能用的记录，没有覆盖。');
        return;
      }
      if (!confirm('导入会覆盖现有全部记录，确定吗？')) return;
      var skipped = parsed.records.length - next.records.length;
      data = next;
      persist();
      historyDate = todayKey();
      lastSeenToday = historyDate;
      renderProfile();
      refreshViews();
      setStatus(skipped > 0 ? '导入好了，跳过 ' + skipped + ' 条' : '已经换成导入的记录');
    };
    reader.onerror = function () { alert('文件没有读出来。'); };
    reader.readAsText(file);
  }

  function catchUpDay() {
    var today = todayKey();
    if (today === lastSeenToday) return;
    lastSeenToday = today;
    if (historyDate > today) historyDate = today;
    renderProfile();
    refreshViews();
  }

  document.getElementById('tabs').addEventListener('click', function (event) {
    var button = event.target.closest('[data-tab]');
    if (!button) return;
    showTab(button.dataset.tab);
  });

  document.querySelector('.subtabs').addEventListener('click', function (event) {
    var button = event.target.closest('[data-kind]');
    if (!button) return;
    showKind(button.dataset.kind);
  });

  document.getElementById('app').addEventListener('click', function (event) {
    var button = event.target.closest('[data-del]');
    if (!button) return;
    var id = button.getAttribute('data-del');
    var next = removeRecord(data.records, id);
    if (next.length === data.records.length) return;
    data.records = next;
    persist();
    refreshViews();
    setStatus('删掉了');
  });

  document.getElementById('prev-day').addEventListener('click', function () {
    historyDate = shiftDate(historyDate, -1, todayKey());
    renderHistory();
  });

  document.getElementById('next-day').addEventListener('click', function () {
    historyDate = shiftDate(historyDate, 1, todayKey());
    renderHistory();
  });

  document.getElementById('history-date').addEventListener('change', function (event) {
    jumpHistory(event.target.value);
  });

  document.getElementById('export-btn').addEventListener('click', exportJson);
  document.getElementById('import-btn').addEventListener('click', function () {
    document.getElementById('import-file').click();
  });
  document.getElementById('import-file').addEventListener('change', function (event) {
    var file = event.target.files && event.target.files[0];
    event.target.value = '';
    if (file) importJson(file);
  });

  window.addEventListener('resize', fitAvatar);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) catchUpDay();
  });
  window.addEventListener('pageshow', catchUpDay);
  setInterval(catchUpDay, 30000);

  syncFeedFields();
  bindFeedForm();
  bindDiaperForm();
  bindSleepForm();
  bindTimeFields();
  bindSettings();
  showKind('feed');
  showTab('home');
  renderToday();
  renderHistory();
})();
</script>

window.addEventListener('load', function () {
  if (!('serviceWorker' in navigator)) return;
  try {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  } catch (err) {}
});
</script>
