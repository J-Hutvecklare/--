<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#e85d75">
<title>奶娃</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./feeding-bottle.png">
<link rel="apple-touch-icon" href="./feeding-bottle.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="page" id="app">
  <header class="mast" id="profile-card">
    <div class="brand">
      <h1>奶娃</h1>
      <p class="brand-sub">你的带娃好帮手</p>
    </div>
    <div class="profile-row">
      <div class="avatar" id="home-avatar"></div>
      <div class="profile-text">
        <p class="profile-name" id="home-name">宝宝</p>
        <p class="profile-age" id="home-age" hidden></p>
        <button type="button" class="profile-age" id="home-age-go">去设置里填出生日期</button>
      </div>
    </div>
  </header>
  <p id="status" class="status" role="status"></p>
  <nav class="tabs" id="tabs" role="tablist" aria-label="分页">
    <button type="button" role="tab" data-tab="home" aria-selected="true" aria-controls="panel-home">首页</button>
    <button type="button" role="tab" data-tab="history" aria-selected="false" aria-controls="panel-history">数据统计</button>
    <button type="button" role="tab" data-tab="settings" aria-selected="false" aria-controls="panel-settings">设置</button>
  </nav>

  <section id="panel-home" data-panel="home" role="tabpanel">
    <div class="record-block">
      <div class="subtabs" role="tablist" aria-label="记录类型">
        <button type="button" role="tab" data-kind="feed" aria-selected="true">喂奶</button>
        <button type="button" role="tab" data-kind="diaper" aria-selected="false">换尿布</button>
        <button type="button" role="tab" data-kind="sleep" aria-selected="false">睡眠</button>
      </div>
      <p class="edit-hint" id="edit-hint" hidden>正在改这一条</p>
    <form id="form-feed" data-kind-panel="feed" autocomplete="off" novalidate>
      <div class="time-stack">
        <div class="time-line">
          <label id="label-feed-start" for="feed-start-btn">开始时间</label>
          <button type="button" id="feed-start-btn" class="time-field" aria-labelledby="label-feed-start feed-start-text"><span class="time-field-text is-empty" id="feed-start-text">选择时间</span></button>
          <input type="hidden" name="time" data-time="now">
        </div>
        <div class="time-line">
          <label id="label-feed-end" for="feed-end-btn">结束时间</label>
          <button type="button" id="feed-end-btn" class="time-field" aria-labelledby="label-feed-end feed-end-text"><span class="time-field-text is-empty" id="feed-end-text">选择时间</span></button>
          <input type="hidden" name="end" data-time="empty">
        </div>
      </div>
      <div class="feed-line">
        <label for="feed-type">类型</label>
        <select id="feed-type" name="feedType">
          <option value="breast">亲喂</option>
          <option value="breast_bottle">母乳瓶喂</option>
          <option value="formula">配方奶</option>
        </select>
        <span id="feed-type-probe" class="select-probe" aria-hidden="true"></span>
        <div id="breast-fields" class="feed-extra">
          <label for="feed-left">左</label>
          <span class="minute-box">
            <input id="feed-left" name="leftMin" type="number" min="0" step="1" inputmode="decimal" aria-describedby="feed-left-unit">
            <span class="minute-unit" id="feed-left-unit">分钟</span>
          </span>
          <label for="feed-right">右</label>
          <span class="minute-box">
            <input id="feed-right" name="rightMin" type="number" min="0" step="1" inputmode="decimal" aria-describedby="feed-right-unit">
            <span class="minute-unit" id="feed-right-unit">分钟</span>
          </span>
        </div>
        <div id="bottle-fields" class="feed-extra" hidden>
          <span class="minute-box">
            <input id="feed-ml" name="amountMl" type="number" min="1" step="1" inputmode="decimal" aria-label="奶量" aria-describedby="feed-ml-unit">
            <span class="minute-unit" id="feed-ml-unit">ml</span>
          </span>
        </div>
      </div>
      <p class="err" data-err></p>
      <div class="form-actions">
        <button type="submit">保存</button>
        <button type="button" data-form-cancel>取消</button>
      </div>
    </form>

    <form id="form-diaper" data-kind-panel="diaper" autocomplete="off" novalidate hidden>
      <div class="diaper-line">
        <div class="time-line">
          <label id="label-diaper-time" for="diaper-time-btn">时间</label>
          <button type="button" id="diaper-time-btn" class="time-field" aria-labelledby="label-diaper-time diaper-time-text"><span class="time-field-text is-empty" id="diaper-time-text">选择时间</span></button>
          <input type="hidden" name="time" data-time="now">
        </div>
        <div class="choice" role="radiogroup" aria-label="大便、小便或都有">
          <label class="choice-item"><input type="radio" name="diaperKind" value="poop">大便</label>
          <label class="choice-item"><input type="radio" name="diaperKind" value="pee">小便</label>
          <label class="choice-item"><input type="radio" name="diaperKind" value="both">都有</label>
        </div>
      </div>
      <p class="err" data-err></p>
      <div class="form-actions">
        <button type="submit">保存</button>
        <button type="button" data-form-cancel>取消</button>
      </div>
    </form>

    <form id="form-sleep" data-kind-panel="sleep" autocomplete="off" novalidate hidden>
      <div class="time-stack">
        <div class="time-line">
          <label id="label-sleep-start" for="sleep-start-btn">开始时间</label>
          <button type="button" id="sleep-start-btn" class="time-field" aria-labelledby="label-sleep-start sleep-start-text"><span class="time-field-text is-empty" id="sleep-start-text">选择时间</span></button>
          <input type="hidden" name="time" data-time="now">
        </div>
        <div class="time-line">
          <label id="label-sleep-end" for="sleep-end-btn">结束时间</label>
          <button type="button" id="sleep-end-btn" class="time-field" aria-labelledby="label-sleep-end sleep-end-text"><span class="time-field-text is-empty" id="sleep-end-text">选择时间</span></button>
          <input type="hidden" name="end" data-time="empty">
        </div>
      </div>
      <p class="err" data-err></p>
      <div class="form-actions">
        <button type="submit">保存</button>
        <button type="button" data-form-cancel>取消</button>
      </div>
    </form>
    </div>
    <h2 class="today-title">今天</h2>
    <div class="stat-grid" id="today-stats" aria-label="今日统计"></div>
    <p class="hint">亲喂只计次数，不换算毫升</p>
    <div id="today-list"></div>
  </section>

  <section id="panel-history" data-panel="history" role="tabpanel" hidden>
    <div class="day-nav">
      <button type="button" id="prev-day" class="mark-teal">前一天</button>
      <label class="day-pick">
        <span id="history-md" aria-hidden="true"></span>
        <input type="date" id="history-date" aria-label="跳到这一天">
      </label>
      <button type="button" id="next-day" class="mark-teal">后一天</button>
    </div>
    <div class="stat-grid" id="history-stats" aria-label="当日统计"></div>
    <p class="hint" id="history-hint">亲喂只计次数，不换算毫升</p>
    <div id="history-list"></div>
    <div class="tools history-tools">
      <button type="button" id="export-btn" class="mark-yellow">导出数据</button>
      <button type="button" id="import-btn" class="mark-teal">导入数据</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden aria-label="导入数据">
    </div>
  </section>

  <section id="panel-settings" data-panel="settings" role="tabpanel" hidden>
    <div class="setting-list">
      <button type="button" class="setting-row" id="open-name">
        <span class="setting-label">宝宝小名</span>
        <span class="setting-value" id="setting-name-value">未设置</span>
        <span class="setting-chevron" aria-hidden="true"></span>
      </button>
      <button type="button" class="setting-row" id="open-birthday">
        <span class="setting-label">出生日期</span>
        <span class="setting-value" id="setting-birthday-value">未设置</span>
        <span class="setting-chevron" aria-hidden="true"></span>
      </button>
      <button type="button" class="setting-row" id="open-avatar">
        <span class="setting-label">头像</span>
        <span class="setting-value" id="setting-avatar-value">未设置</span>
        <span class="setting-chevron" aria-hidden="true"></span>
      </button>
    </div>
    <p class="saved-note" id="settings-saved" role="status"></p>
  </section>

</main>
<div id="time-sheet" class="time-sheet" hidden>
  <div class="time-sheet-backdrop" data-cancel></div>
  <div class="time-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="time-sheet-preview">
    <p class="time-preview" id="time-sheet-preview"></p>
    <div class="time-cols">
      <div class="time-highlight" aria-hidden="true"></div>
      <div class="time-col" id="time-col-date" aria-label="日期"></div>
      <div class="time-col" id="time-col-hour" aria-label="小时"></div>
      <div class="time-col" id="time-col-minute" aria-label="分钟"></div>
    </div>
    <div class="time-actions">
      <button type="button" data-cancel>取消</button>
      <button type="button" class="mark-red" data-ok>确定</button>
    </div>
  </div>
</div>
<div id="date-sheet" class="time-sheet date-sheet" hidden>
  <div class="time-sheet-backdrop" data-cancel></div>
  <div class="time-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="date-sheet-preview">
    <p class="time-preview" id="date-sheet-preview"></p>
    <div class="time-cols">
      <div class="time-highlight" aria-hidden="true"></div>
      <div class="time-col" id="date-col-year" aria-label="年"></div>
      <div class="time-col" id="date-col-month" aria-label="月"></div>
      <div class="time-col" id="date-col-day" aria-label="日"></div>
    </div>
    <div class="time-actions">
      <button type="button" data-cancel>取消</button>
      <button type="button" class="mark-red" data-ok>确定</button>
    </div>
  </div>
</div>
<div id="name-sheet" class="time-sheet" hidden>
  <div class="time-sheet-backdrop" data-cancel></div>
  <div class="time-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="name-sheet-title">
    <h2 id="name-sheet-title">宝宝小名</h2>
    <label class="field" for="profile-name">小名
      <input id="profile-name" type="text" maxlength="40" placeholder="可空着" autocomplete="off" enterkeyhint="done">
    </label>
    <div class="time-actions">
      <button type="button" data-cancel>取消</button>
      <button type="button" class="mark-red" data-ok>确定</button>
    </div>
  </div>
</div>
<div id="avatar-sheet" class="time-sheet" hidden>
  <div class="time-sheet-backdrop" data-cancel></div>
  <div class="time-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="avatar-sheet-title">
    <h2 id="avatar-sheet-title">头像</h2>
    <div class="avatar-preview" id="avatar-preview"></div>
    <div class="avatar-upload">
      <label class="file-btn" id="avatar-label" for="avatar-file">上传照片</label>
      <input id="avatar-file" class="sr-only" type="file" accept="image/*">
    </div>
    <div class="time-actions">
      <button type="button" data-cancel>完成</button>
    </div>
  </div>
</div>
<noscript><p class="empty">要打开 JavaScript 才能记账。</p></noscript>
<script src="./app.js"></script>
</body>
</html>
